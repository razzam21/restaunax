stages:
  - build
  - deploy

variables:
  # Docker configuration
  DOCKER_HOST: unix:///var/run/docker.sock
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  
  # Application configuration
  FRONTEND_PORT: "3001"
  OLLAMA_URL: "http://10.13.0.254:11434"
  CORS_ORIGIN: "https://restaunax.turnersrus.com"
  OLLAMA_MODEL: "deepseek-coder:1.3b"

# Build all Docker images for the application
build_images:
  stage: build
  image: docker:latest
  services: []
  before_script:
    - apk add --no-cache bash
    - ls -l /var/run/docker*
    - echo "Building Restaunax application images..."
  script:
    # Create production .env file from template
    - echo "Creating production .env from template..."
    - cp .env.example .env
    
    # Generate secure database password
    - DB_PASSWORD="postgres_prod_$(date +%s | sha256sum | head -c 16)"
    
    # Update configuration using sed
    - echo "Updating environment configuration for production..."
    
    # Environment and ports
    - sed -i "s/NODE_ENV=development/NODE_ENV=production/" .env
    - sed -i "s/CLIENT_PORT=3000/CLIENT_PORT=${FRONTEND_PORT}/" .env
    - sed -i "s/GENERATE_SOURCEMAP=true/GENERATE_SOURCEMAP=false/" .env
    
    # Database configuration
    - sed -i "s/POSTGRES_PASSWORD=postgres/POSTGRES_PASSWORD=${DB_PASSWORD}/" .env
    - sed -i "s|DATABASE_URL=postgresql://postgres:postgres@db:5432/restaunax|DATABASE_URL=postgresql://postgres:${DB_PASSWORD}@db:5432/restaunax|" .env
    
    # API and CORS configuration
    - sed -i "s|REACT_APP_API_URL=http://localhost:8081/api|REACT_APP_API_URL=https://restaunax.turnersrus.com/api|" .env
    - sed -i "s|CORS_ORIGIN=http://localhost:3000|CORS_ORIGIN=${CORS_ORIGIN}|" .env
    
    # JWT Configuration - Use provided secrets
    - |
      JWT_ACCESS_SECRET=""
      JWT_REFRESH_SECRET=""
      
      # Replace JWT secrets using line replacement
      sed -i "/^JWT_ACCESS_SECRET=/c\JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}" .env
      sed -i "/^JWT_REFRESH_SECRET=/c\JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}" .env
    
    # AI Configuration - Enable AI features
    - sed -i "s/AI_ENABLED=false/AI_ENABLED=true/" .env
    - sed -i "s/OLLAMA_ENABLED=false/OLLAMA_ENABLED=true/" .env
    - sed -i "s|OLLAMA_BASE_URL=http://localhost:11434|OLLAMA_BASE_URL=${OLLAMA_URL}|" .env
    - sed -i "s/OLLAMA_MODEL=llama3.2/OLLAMA_MODEL=${OLLAMA_MODEL}/" .env
    - sed -i "s/OLLAMA_TIMEOUT=30000/OLLAMA_TIMEOUT=60000/" .env
    - sed -i "s/AI_PRIMARY_ENGINE=ollama/AI_PRIMARY_ENGINE=ollama/" .env
    
    # Show .env file (without secrets) for debugging
    - echo "Generated .env file configuration:"
    - cat .env | grep -v "SECRET\|PASSWORD\|_KEY" | head -20
    
    # Build individual service images for production using Docker Bake
    - echo "Building Restaunax service images for production..."
    - export DOCKER_TARGET=production
    - COMPOSE_BAKE=true docker compose build --no-cache
    
    # Tag images for registry
    - docker tag restaunax-client:latest $UNRAID_SERVER:5000/restaunax-client:latest
    - docker tag restaunax-server:latest $UNRAID_SERVER:5000/restaunax-server:latest
    
    # Push images to registry
    - echo "Pushing images to registry..."
    - docker push $UNRAID_SERVER:5000/restaunax-client:latest
    - docker push $UNRAID_SERVER:5000/restaunax-server:latest
    
    # Create deployment archive with configuration
    - echo "Creating deployment package..."
    - tar -czf restaunax-deploy.tar.gz docker-compose.production.yml .env docker/
    
  artifacts:
    paths:
      - restaunax-deploy.tar.gz
      - .env
    expire_in: 1 hour

# Deploy to Unraid server
deploy_to_unraid:
  stage: deploy
  image: alpine:latest
  dependencies:
    - build_images
  before_script:
    - apk add --no-cache openssh tar
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - |
      echo -e "Host $UNRAID_SERVER
        StrictHostKeyChecking no
        IdentitiesOnly yes
        PreferredAuthentications publickey
        PubkeyAuthentication yes
        PasswordAuthentication no
      " > ~/.ssh/config
    - echo "$UNRAID_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-add ~/.ssh/id_rsa
    
  script:
    - echo "Deploying Restaunax to Unraid server..."
    
    # Transfer deployment package to Unraid
    - scp restaunax-deploy.tar.gz $UNRAID_USER@$UNRAID_SERVER:/tmp/
    
    # Deploy on Unraid server
    - ssh $UNRAID_USER@$UNRAID_SERVER "
        set -e &&
        echo 'Setting up Restaunax deployment directory...' &&
        mkdir -p /mnt/user/appdata/restaunax &&
        cd /mnt/user/appdata/restaunax &&
        
        echo 'Extracting deployment package...' &&
        tar -xzf /tmp/restaunax-deploy.tar.gz &&
        rm /tmp/restaunax-deploy.tar.gz &&
        
        echo 'Pulling latest images from registry...' &&
        docker pull $UNRAID_SERVER:5000/restaunax-client:latest &&
        docker pull $UNRAID_SERVER:5000/restaunax-server:latest &&
        
        echo 'Stopping existing Restaunax services...' &&
        docker compose -f docker-compose.production.yml -p restaunax down || true &&
        
        echo 'Pruning old images to free space...' &&
        docker image prune -f &&
        
        echo 'Starting Restaunax services...' &&
        docker compose -f docker-compose.production.yml -p restaunax up -d &&
        
        echo 'Waiting for services to be ready...' &&
        sleep 30 &&
        
        echo 'Checking service status...' &&
        docker compose -f docker-compose.production.yml -p restaunax ps &&
        
        echo 'Verifying frontend accessibility...' &&
        curl -f http://localhost:${FRONTEND_PORT} > /dev/null && echo 'Frontend is responding' || echo 'Frontend check failed' &&
        
        echo 'Verifying backend API...' &&
        curl -f http://localhost:8081/api/health > /dev/null && echo 'Backend API is responding' || echo 'Backend API check failed' &&
        
        echo 'Restaunax deployment completed successfully!'
      "
    
    # Optional: Run post-deployment health checks
    - echo "Running post-deployment verification..."
    - ssh $UNRAID_USER@$UNRAID_SERVER "
        cd /mnt/user/appdata/restaunax &&
        echo 'Final service status:' &&
        docker compose -f docker-compose.production.yml -p restaunax ps &&
        echo 'Container logs (last 10 lines):' &&
        docker compose -f docker-compose.production.yml -p restaunax logs --tail=10
      "
      
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: on_success
  
  environment:
    name: production
    url: https://restaunax.turnersrus.com

# Optional: Rollback job (manual trigger)
rollback_deployment:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$UNRAID_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-add ~/.ssh/id_rsa
  script:
    - echo "Rolling back Restaunax deployment..."
    - ssh $UNRAID_USER@$UNRAID_SERVER "
        cd /mnt/user/appdata/restaunax &&
        docker compose -f docker-compose.production.yml -p restaunax down &&
        echo 'Restaunax services stopped. Manual intervention required for complete rollback.'
      "
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: manual
      allow_failure: true