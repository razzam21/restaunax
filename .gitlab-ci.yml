stages:
  - build
  - deploy

variables:
  # Docker configuration
  DOCKER_HOST: unix:///var/run/docker.sock
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  
  # Application configuration
  FRONTEND_PORT: "3004"
  OLLAMA_URL: "http://10.13.0.254:11434"
  CORS_ORIGIN: "http://restaunax.turnersrus.com,https://restaunax.turnersrus.com"
  OLLAMA_MODEL: "deepseek-coder:1.3b"

# Build all Docker images for the application
build_images:
  stage: build
  image: docker:latest
  services: []
  before_script:
    - apk add --no-cache bash
    - ls -l /var/run/docker*
    - echo "Building Restaunax application images..."
  script:
    # Create production .env file from template
    - echo "Creating production .env from template..."
    - cp .env.example .env
    
    # Generate secure database password
    - DB_PASSWORD="postgres_prod_$(date +%s | sha256sum | head -c 16)"
    
    # Update configuration using sed
    - echo "Updating environment configuration for production..."
    
    # Environment and ports
    - sed -i "s/NODE_ENV=development/NODE_ENV=production/" .env
    - sed -i "s/CLIENT_PORT=3000/CLIENT_PORT=${FRONTEND_PORT}/" .env
    - sed -i "s/GENERATE_SOURCEMAP=true/GENERATE_SOURCEMAP=false/" .env
    
    # Database configuration
    - sed -i "s/POSTGRES_PASSWORD=postgres/POSTGRES_PASSWORD=${DB_PASSWORD}/" .env
    - sed -i "s|DATABASE_URL=postgresql://postgres:postgres@db:5432/restaunax|DATABASE_URL=postgresql://postgres:${DB_PASSWORD}@db:5432/restaunax|" .env
    
    # API and CORS configuration
    - sed -i "s|REACT_APP_API_URL=http://localhost:8081/api|REACT_APP_API_URL=https://restaunax.turnersrus.com/api|" .env
    - sed -i "s|CORS_ORIGIN=http://localhost:3000|CORS_ORIGIN=${CORS_ORIGIN}|" .env
    
    # JWT Configuration - Generate secure random secrets
    - echo "Generating secure JWT secrets..."
    - JWT_ACCESS_SECRET=$(openssl rand -hex 256)
    - JWT_REFRESH_SECRET=$(openssl rand -hex 256)
    - echo "JWT secrets generated successfully"
    
    # Replace JWT secrets using line replacement
    - sed -i "/^JWT_ACCESS_SECRET=/c\JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}" .env
    - sed -i "/^JWT_REFRESH_SECRET=/c\JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}" .env
    
    # AI Configuration - Enable AI features
    - sed -i "s/AI_ENABLED=false/AI_ENABLED=true/" .env
    - sed -i "s/OLLAMA_ENABLED=false/OLLAMA_ENABLED=true/" .env
    - sed -i "s|OLLAMA_BASE_URL=http://localhost:11434|OLLAMA_BASE_URL=${OLLAMA_URL}|" .env
    - sed -i "s/OLLAMA_MODEL=llama3.2/OLLAMA_MODEL=${OLLAMA_MODEL}/" .env
    - sed -i "s/OLLAMA_TIMEOUT=30000/OLLAMA_TIMEOUT=60000/" .env
    - sed -i "s/AI_PRIMARY_ENGINE=ollama/AI_PRIMARY_ENGINE=ollama/" .env
    
    # Show .env file (without secrets) for debugging
    - echo "Generated .env file configuration:"
    - grep -v "SECRET\|PASSWORD\|_KEY" .env | head -20 || true
    
    # Build individual service images for production using direct Docker builds
    - echo "Building Restaunax service images for production..."
    
    # Build server image directly
    - cd server
    - docker build -f ../docker/server/Dockerfile --target production -t restaunax-server:latest .
    - cd ..
    
    # Build client image directly  
    - cd client
    - cp ../docker/client/nginx.conf ./nginx.conf
    - docker build -f ../docker/client/Dockerfile --target production -t restaunax-client:latest .
    - cd ..
    
    # Tag images for registry
    - docker tag restaunax-client:latest $UNRAID_SERVER:5000/restaunax-client:latest
    - docker tag restaunax-server:latest $UNRAID_SERVER:5000/restaunax-server:latest
    
    # Push images to registry
    - echo "Pushing images to registry..."
    - docker push $UNRAID_SERVER:5000/restaunax-client:latest
    - docker push $UNRAID_SERVER:5000/restaunax-server:latest
    
    # Create deployment archive with configuration
    - echo "Creating deployment package..."
    - tar -czf restaunax-deploy.tar.gz docker-compose.production.yml .env docker/
    
  artifacts:
    paths:
      - restaunax-deploy.tar.gz
      - .env
    expire_in: 1 hour

# Deploy to Unraid server
deploy_to_unraid:
  stage: deploy
  image: alpine:latest
  dependencies:
    - build_images
  before_script:
    - apk add --no-cache openssh tar
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - |
      echo -e "Host $UNRAID_SERVER
        StrictHostKeyChecking no
        IdentitiesOnly yes
        PreferredAuthentications publickey
        PubkeyAuthentication yes
        PasswordAuthentication no
      " > ~/.ssh/config
    - echo "$UNRAID_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-add ~/.ssh/id_rsa
    
  script:
    - echo "Deploying Restaunax to Unraid server..."
    
    # Transfer deployment package to Unraid
    - scp restaunax-deploy.tar.gz $UNRAID_USER@$UNRAID_SERVER:/tmp/
    
    # Deploy on Unraid server - Setup and extract
    - ssh $UNRAID_USER@$UNRAID_SERVER "mkdir -p /mnt/user/appdata/restaunax && cd /mnt/user/appdata/restaunax && tar -xzf /tmp/restaunax-deploy.tar.gz && rm /tmp/restaunax-deploy.tar.gz"
    
    # Preserve existing credentials if database exists
    - ssh $UNRAID_USER@$UNRAID_SERVER 'cd /mnt/user/appdata/restaunax && if docker ps -a --format "{{.Names}}" | grep -q "^restaunax-db$"; then echo "Preserving existing credentials..."; if docker ps --format "{{.Names}}" | grep -q "^restaunax-server$"; then OLD_DB_PASSWORD=$(docker exec restaunax-server printenv POSTGRES_PASSWORD 2>/dev/null || echo ""); OLD_JWT_ACCESS=$(docker exec restaunax-server printenv JWT_ACCESS_SECRET 2>/dev/null || echo ""); OLD_JWT_REFRESH=$(docker exec restaunax-server printenv JWT_REFRESH_SECRET 2>/dev/null || echo ""); else OLD_DB_PASSWORD=$(docker exec restaunax-db printenv POSTGRES_PASSWORD 2>/dev/null || echo ""); fi; if [ ! -z "$OLD_DB_PASSWORD" ]; then sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$OLD_DB_PASSWORD/" .env && sed -i "s|^DATABASE_URL=.*|DATABASE_URL=postgresql://postgres:$OLD_DB_PASSWORD@db:5432/restaunax|" .env && echo "Database password preserved"; fi; if [ ! -z "$OLD_JWT_ACCESS" ]; then sed -i "s/^JWT_ACCESS_SECRET=.*/JWT_ACCESS_SECRET=$OLD_JWT_ACCESS/" .env && echo "JWT access secret preserved"; fi; if [ ! -z "$OLD_JWT_REFRESH" ]; then sed -i "s/^JWT_REFRESH_SECRET=.*/JWT_REFRESH_SECRET=$OLD_JWT_REFRESH/" .env && echo "JWT refresh secret preserved"; fi; else echo "Using new credentials"; fi'
    
    # Pull images and deploy
    - ssh $UNRAID_USER@$UNRAID_SERVER "cd /mnt/user/appdata/restaunax && docker pull $UNRAID_SERVER:5000/restaunax-client:latest && docker pull $UNRAID_SERVER:5000/restaunax-server:latest && docker compose -f docker-compose.production.yml -p restaunax down && docker image prune -f && docker compose -f docker-compose.production.yml -p restaunax up -d"
    
    # Health checks and status
    - echo "Running post-deployment verification..."
    - ssh $UNRAID_USER@$UNRAID_SERVER "cd /mnt/user/appdata/restaunax && sleep 30 && docker compose -f docker-compose.production.yml -p restaunax ps"
    - ssh $UNRAID_USER@$UNRAID_SERVER "curl -f http://localhost:${FRONTEND_PORT} > /dev/null && echo 'Frontend responding' || echo 'Frontend check failed'"
    - ssh $UNRAID_USER@$UNRAID_SERVER "curl -f http://localhost:8081/api/health > /dev/null && echo 'Backend API responding' || echo 'Backend API check failed'"
      
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: on_success
  
  environment:
    name: production
    url: https://restaunax.turnersrus.com

# Optional: Rollback job (manual trigger)
rollback_deployment:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$UNRAID_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-add ~/.ssh/id_rsa
  script:
    - echo "Rolling back Restaunax deployment..."
    - ssh $UNRAID_USER@$UNRAID_SERVER "
        cd /mnt/user/appdata/restaunax &&
        docker compose -f docker-compose.production.yml -p restaunax down &&
        echo 'Restaunax services stopped. Manual intervention required for complete rollback.'
      "
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: manual
      allow_failure: true